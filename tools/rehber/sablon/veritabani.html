<title>Hadal Veritabanı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Düzen: sabit üst bar (başlık + sekmeler); altında liste | ayrıntı iki sütunu, telefonda tek sütun.
   Cihaz paneli dili: derin deniz zemini, sonar camgöbeği vurgu, rakamlar eş aralıklı. */
:root {
  --bg: #0b1a22; --surface: #10242e; --surface-2: #17313e; --line: #23434f;
  --fg: #e2eef1; --muted: #8ea8b2; --accent: #5ec8d6; --accent-ink: #062027; --signal: #f0a85c;
  --s1: #5ec8d6; --s2: #f0a85c; --s3: #b59cf0;
  --r-common: #9fb3ba; --r-rare: #5ea8e6; --r-epic: #b78cf0; --r-legendary: #f0c060;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #edf3f4; --surface: #ffffff; --surface-2: #e1eaed; --line: #c3d3d8;
  --fg: #0f2530; --muted: #4c6670; --accent: #0a7c8b; --accent-ink: #ffffff; --signal: #b5621b;
  --s1: #0a7c8b; --s2: #b5621b; --s3: #6a4fc4;
  --r-common: #5f727a; --r-rare: #1f6fb5; --r-epic: #7a4fc4; --r-legendary: #a87a10;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #edf3f4; --surface: #ffffff; --surface-2: #e1eaed; --line: #c3d3d8;
  --fg: #0f2530; --muted: #4c6670; --accent: #0a7c8b; --accent-ink: #ffffff; --signal: #b5621b;
  --s1: #0a7c8b; --s2: #b5621b; --s3: #6a4fc4;
  --r-common: #5f727a; --r-rare: #1f6fb5; --r-epic: #7a4fc4; --r-legendary: #a87a10;
  color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding-block: 14px 8px; }
.brand h1 { font: 600 22px/1.1 var(--font-display); letter-spacing: .04em; margin: 0; text-transform: uppercase; }
.brand .sub { color: var(--muted); font-size: 13px; }
.gauge { margin-left: auto; font: 500 12px/1 var(--font-data); color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.gauge b { color: var(--accent); font-weight: 500; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { flex: none; padding: 10px 14px; color: var(--muted); text-decoration: none; font: 600 13px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; border-bottom: 2px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 20px 48px; }
.cols { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
aside.list { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 8px; max-height: calc(100vh - 160px); overflow: auto; }
@media (max-width: 820px) { aside.list { max-height: 260px; } }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); font: inherit; }
.group h3 { font: 600 11px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 4px 4px; }
.item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; border: 0; border-radius: 4px; background: none; color: var(--fg); font: inherit; cursor: pointer; }
.item:hover { background: var(--surface-2); }
.item[aria-selected="true"] { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
.item .tag { margin-left: auto; font: 500 11px/1 var(--font-data); color: var(--muted); }
section.detail { display: grid; gap: 18px; min-width: 0; }
h2 { font: 600 24px/1.15 var(--font-display); margin: 0; text-wrap: balance; }
h4 { font: 600 13px/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lede { color: var(--muted); max-width: 70ch; margin: 4px 0 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
.pill.st-kodda { border-color: var(--accent); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.fact span { display: block; font-size: 12px; color: var(--muted); }
.fact strong { font: 500 15px/1.35 var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.tier { border-left: 3px solid var(--line); padding: 6px 10px; background: var(--surface); }
.tier.on { border-left-color: var(--accent); }
.tier b { display: block; font: 600 13px/1.2 var(--font-display); }
.tier small { color: var(--muted); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: top; }
th { position: sticky; top: 0; background: var(--surface-2); font: 600 11px/1.3 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.n, th.n { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 220px; max-width: 520px; }
tr.mark td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: none; color: var(--muted); padding: 6px 12px; font: 600 12px/1 var(--font-display); letter-spacing: .05em; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
.calc label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.calc select, .calc input { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); font: 500 14px var(--font-data); min-width: 0; }
section.detail > * { min-width: 0; }
.result { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.result .fact strong { font-size: 17px; }
.note { font-size: 12px; color: var(--muted); max-width: 80ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.card { text-align: left; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 10px 12px; color: var(--fg); font: inherit; cursor: pointer; display: grid; gap: 4px; border-top: 3px solid var(--rc, var(--line)); }
.card:hover { background: var(--surface-2); }
.card small { color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--font-data); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; }
.empty { color: var(--muted); padding: 20px; border: 1px dashed var(--line); border-radius: 6px; }
@media (prefers-reduced-motion: no-preference) { .item, .card, nav.tabs a { transition: background .15s, color .15s, border-color .15s; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Hadal Veritabanı</h1>
      <span class="sub" id="sub"></span>
      <div class="gauge" id="gauge"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Bölümler"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
const DB = /*__VERI__*/null;
const nf = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 2 });
const n = (x) => x === null || x === undefined || x === "" ? "—" : (typeof x === "number" ? nf.format(x) : String(x));
function sure(sn) {
  sn = Math.round(sn || 0); if (sn <= 0) return "—";
  if (sn < 120) return sn + " sn";
  if (sn < 3600) { const d = Math.floor(sn / 60), s = sn % 60; return d + " dk" + (s ? " " + s + " sn" : ""); }
  if (sn < 86400) { const s = Math.floor(sn / 3600), d = Math.floor((sn % 3600) / 60); return s + " sa" + (d ? " " + d + " dk" : ""); }
  const g = Math.floor(sn / 86400), s = Math.floor((sn % 86400) / 3600), d = Math.floor((sn % 3600) / 60);
  return g + " g" + (s ? " " + s + " sa" : "") + (d ? " " + d + " dk" : "");
}
const gun = (g) => g === null || g === undefined ? "—" : (g < 1 ? sure(g * 86400) : nf.format(Math.round(g * 10) / 10) + ". gün");
function bicim(v, tur) {
  if (v === null || v === undefined) return "—";
  if (tur === "sure") return sure(v);
  if (tur === "gun") return gun(v);
  if (tur === "yuzde") return (v < 0 ? "−%" : "%") + nf.format(Math.abs(v));
  if (tur === "para") return n(v) + " $";
  if (tur === "kisa") return Math.abs(v) >= 1e6 ? nf.format(Math.round(v / 1e4) / 100) + " M" : (Math.abs(v) >= 1e4 ? nf.format(Math.round(v / 100) / 10) + " B" : n(v));
  if (tur === "tam") return n(Math.round(v));
  if (Array.isArray(v)) return v.map((x) => bicim(x)).join(", ");
  if (typeof v === "boolean") return v ? "evet" : "hayır";
  if (typeof v === "object") return Object.entries(v).map(([k, x]) => k + ": " + bicim(x)).join(" · ");
  return n(v);
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const K = Object.fromEntries(DB.kaynaklar.map((k) => [k.id, k]));
const kad = (id) => (K[id] ? K[id].ad : id);
const ORDER = DB.kaynaklar.map((k) => k.id);
const app = document.getElementById("app");
const store = { get(k) { try { return localStorage.getItem("hadal-db:" + k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem("hadal-db:" + k, v); } catch (e) {} } };

function table(heads, rows, numeric) {
  const th = heads.map((h, i) => `<th class="${numeric && numeric[i] ? "n" : ""}">${esc(h)}</th>`).join("");
  const tr = rows.map((r) => `<tr class="${r.mark ? "mark" : ""}">` + r.cells.map((c, i) =>
    `<td class="${numeric && numeric[i] ? "n" : (typeof c === "string" && c.length > 48 ? "wrap" : "")}">${c}</td>`).join("") + "</tr>").join("");
  return `<div class="tbl"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
const resCols = (rows, key) => ORDER.filter((id) => rows.some((r) => r[key] && r[key][id] !== undefined));
const chip = (id) => `<span class="dot" style="background:${K[id] ? K[id].renk : "var(--muted)"}"></span>`;

/* --- sekmeler ----------------------------------------------------------- */
const TABS = [
  ["binalar", "Binalar", viewBuildings],
  ["hesaplayici", "Hesaplayıcı", viewCalc],
  ["kahramanlar", "Kahramanlar", viewHeroes],
  ["arastirma", "Araştırma", viewResearch],
  ["tempo", "Tempo", viewTempo],
  ["tablolar", "Diğer tablolar", viewTables],
];
let state = { tab: "binalar", bina: store.get("bina") || "core_reactor", mod: "hedef", kahraman: null, dal: null, tablo: 0 };

function go(tab) {
  state.tab = TABS.some((t) => t[0] === tab) ? tab : "binalar";
  document.getElementById("tabs").innerHTML = TABS.map(([id, ad]) =>
    `<a href="#${id}" ${id === state.tab ? 'aria-current="page"' : ""}>${ad}</a>`).join("");
  TABS.find((t) => t[0] === state.tab)[2]();
}
window.addEventListener("hashchange", () => go(location.hash.slice(1)));

/* --- binalar ------------------------------------------------------------ */
function buildingList(q) {
  const groups = DB.kategoriler.map((k) => [k, DB.binalar.filter((b) => b.kategori === k.id &&
    (!q || (b.ad + " " + b.id).toLocaleLowerCase("tr").includes(q)))]).filter(([, l]) => l.length);
  return groups.map(([k, l]) => `<div class="group"><h3>${esc(k.ad)}</h3>` + l.map((b) =>
    `<button class="item" data-b="${b.id}" aria-selected="${b.id === state.bina}">${esc(b.ad)}<span class="tag">${b.durum}</span></button>`).join("") + "</div>").join("");
}
function viewBuildings() {
  app.innerHTML = `<div class="cols"><aside class="list"><input class="search" id="q" placeholder="Bina ara" aria-label="Bina ara">
    <div id="blist">${buildingList("")}</div></aside><section class="detail" id="bd"></section></div>`;
  document.getElementById("q").addEventListener("input", (e) => {
    document.getElementById("blist").innerHTML = buildingList(e.target.value.toLocaleLowerCase("tr").trim()); bindList(); });
  bindList(); renderBuilding();
}
function bindList() {
  document.querySelectorAll("#blist .item").forEach((el) => el.addEventListener("click", () => {
    state.bina = el.dataset.b; store.set("bina", state.bina);
    document.querySelectorAll("#blist .item").forEach((x) => x.setAttribute("aria-selected", x === el)); renderBuilding(); }));
}
function renderBuilding() {
  const b = DB.binalar.find((x) => x.id === state.bina) || DB.binalar[0];
  const v8 = b.v8 && state.mod === "v8";
  const rows = v8 ? b.v8 : b.satirlar;
  const cols = resCols(rows, "bedel");
  const kat = DB.kategoriler.find((k) => k.id === b.kategori);
  const first = b.satirlar[0], last = b.satirlar[b.satirlar.length - 1];
  const tiers = (b.evrim || []).map((t, i) => `<div class="tier"><b>${esc(t.ad)}</b><small>${esc(t.katman)} · Sv ${esc(t.seviyeler)}</small><br><small>${esc(t.gorunum || "")}</small></div>`).join("");
  const heads = ["Sv", "Reaktör"].concat(b.id === "core_reactor" && !v8 ? ["Önkoşul"] : []).concat(cols.map(kad)).concat(["Süre", v8 ? "Üretim/sa" : "Güç", v8 ? "" : "Üretim/sa", "Kümülatif süre"]).filter((h) => h !== "");
  let kum = 0;
  const body = rows.map((r) => {
    kum += r.sure || 0;
    const cells = [r.seviye, v8 ? "—" : (r.hazir ? "—" : r.reaktor)];
    if (b.id === "core_reactor" && !v8) cells.push(esc(b.onkosul[r.seviye] || "—"));
    cols.forEach((c) => cells.push(r.hazir ? "—" : n(r.bedel[c])));
    cells.push(r.hazir ? "Başlangıç" : sure(r.sure));
    if (!v8) cells.push(n(r.guc));
    cells.push(Object.entries(r.uretim || {}).map(([k, x]) => chip(k) + " " + n(Math.round(x))).join(" ") || "—");
    cells.push(sure(kum));
    return { cells, mark: r.seviye % 10 === 0 };
  });
  const numeric = heads.map((h) => !["Önkoşul", "Üretim/sa"].includes(h));
  document.getElementById("bd").innerHTML = `
    <div><h2>${esc(b.ad)}</h2><p class="lede">${esc(b.aciklama)}</p></div>
    <div class="meta"><span class="pill">${esc(kat ? kat.ad : b.kategori)}</span><span class="pill ${b.durumKodu === "kodda" ? "st-kodda" : ""}">${b.durum} ${b.durumKodu === "kodda" ? "oyunda var" : "tasarım"}</span><span class="pill"><code>${b.id}</code></span></div>
    <p>${esc(b.islev)}</p>
    <div class="facts">
      <div class="fact"><span>Açılış</span><strong>${esc(b.acilis)}</strong></div>
      <div class="fact"><span>Adet</span><strong>${esc(b.adetMetni)}</strong></div>
      <div class="fact"><span>En yüksek seviye</span><strong>${b.maks}</strong></div>
      <div class="fact"><span>Toplam ham süre</span><strong>${sure(b.toplamSure)}</strong></div>
      <div class="fact"><span>Toplam maliyet</span><strong>${Object.entries(b.toplamBedel).map(([k, x]) => chip(k) + " " + n(x)).join("<br>")}</strong></div>
      ${Object.keys(last.uretim || {}).length ? `<div class="fact"><span>Üretim/sa (Sv 1 → ${last.seviye})</span><strong>${Object.keys(last.uretim).map((k) => chip(k) + " " + n(Math.round(first.uretim[k])) + " → " + n(Math.round(last.uretim[k]))).join("<br>")}</strong></div>` : ""}
    </div>
    ${tiers ? `<div><h4>Görünüm evrimi</h4><div class="tiers">${tiers}</div></div>` : ""}
    ${b.kilitler.length ? `<div><h4>${b.id === "core_reactor" ? "Reaktör seviyeleriyle açılanlar" : "Seviye kilitleri"}</h4>${table(["Sv", "Açılan"], b.kilitler.map((k) => ({ cells: [k[0], esc(k[1])] })), [true, false])}</div>` : ""}
    <div class="row"><h4 style="margin:0">Seviye tablosu</h4>
      ${b.v8 ? `<div class="seg" role="group" aria-label="Değer kümesi"><button id="m-h" aria-pressed="${!v8}">Hedef</button><button id="m-v" aria-pressed="${v8}">Bugün (v8)</button></div>` : ""}</div>
    <p class="note">${v8 ? "Bugün oyunda olan değerler (catalog v8)." : "Maliyet ve süre o seviyeye yükseltmenin bedelidir; süre hız bonuslarından önceki ham değerdir. Her 10. seviye bir evrim katmanıdır."}</p>
    ${table(heads, body, numeric)}`;
  const mh = document.getElementById("m-h"), mv = document.getElementById("m-v");
  if (mh) { mh.onclick = () => { state.mod = "hedef"; renderBuilding(); }; mv.onclick = () => { state.mod = "v8"; renderBuilding(); }; }
}

/* --- hesaplayıcı -------------------------------------------------------- */
function viewCalc() {
  const opts = DB.binalar.map((b) => `<option value="${b.id}" ${b.id === state.bina ? "selected" : ""}>${esc(b.ad)}</option>`).join("");
  const vipOpts = (DB.vip || []).map((v) => `<option value="${v.hiz}">${esc(v.ad)} (+%${nf.format(v.hiz)})</option>`).join("");
  app.innerHTML = `<section class="detail">
    <div><h2>Yükseltme hesaplayıcı</h2><p class="lede">Bir binayı (ya da birkaç örneğini) bir seviyeden ötekine çıkarmanın toplam maliyeti, ham ve etkin süresi ve kazandırdığı güç. Etkin süre kanondaki bölen formülüyle hesaplanır: ham / (1 + toplam hız %), sonra ittifak yardımı ve ücretsiz bitirme düşülür.</p></div>
    <div class="calc">
      <label>Bina<select id="c-b">${opts}</select></label>
      <label>Şu anki seviye<input id="c-a" type="number" min="0" value="0"></label>
      <label>Hedef seviye<input id="c-z" type="number" min="1" value="10"></label>
      <label>Örnek sayısı<input id="c-n" type="number" min="1" value="1"></label>
      <label>Araştırma hızı %<input id="c-r" type="number" min="0" value="30"></label>
      <label>Kahraman hızı %<input id="c-h" type="number" min="0" value="3"></label>
      <label>VIP${vipOpts ? `<select id="c-v"><option value="0">VIP yok</option>${vipOpts}</select>` : `<input id="c-v" type="number" min="0" value="0">`}</label>
      <label>Diğer hız % (ittifak, unvan)<input id="c-o" type="number" min="0" value="0"></label>
      <label>Yardım sayısı / inşaat<input id="c-y" type="number" min="0" max="20" value="10"></label>
      <label>Ücretsiz bitirme (dk)<input id="c-f" type="number" min="0" value="5"></label>
      <label>Hızlandırma stoğu (saat)<input id="c-s" type="number" min="0" value="0"></label>
    </div>
    <div class="result" id="c-out"></div>
    <div id="c-rows"></div></section>`;
  const ids = ["c-b", "c-a", "c-z", "c-n", "c-r", "c-h", "c-v", "c-o", "c-y", "c-f", "c-s"];
  ids.forEach((id) => document.getElementById(id).addEventListener("input", calc));
  calc();
}
function calc() {
  const g = (id) => Number(document.getElementById(id).value) || 0;
  const b = DB.binalar.find((x) => x.id === document.getElementById("c-b").value);
  const maks = b.maks; let a = Math.max(0, Math.min(maks - 1, g("c-a"))); let z = Math.max(a + 1, Math.min(maks, g("c-z")));
  const cnt = Math.max(1, g("c-n")); const hiz = g("c-r") + g("c-h") + g("c-v") + g("c-o");
  const yardim = Math.min(20, g("c-y")), ff = g("c-f") * 60;
  const top = {}; let ham = 0, etkin = 0, guc = 0; const rows = [];
  for (const r of b.satirlar.slice(a, z)) {
    if (r.hazir) continue;
    Object.entries(r.bedel).forEach(([k, x]) => { top[k] = (top[k] || 0) + x * cnt; });
    let d = r.sure / (1 + hiz / 100); d -= Math.min(d, yardim * Math.max(0.01 * d, 60)); d = Math.max(0, d - ff);
    ham += r.sure * cnt; etkin += d * cnt; guc += r.guc * cnt;
    rows.push({ cells: [r.seviye, ...Object.keys(r.bedel).length ? [Object.entries(r.bedel).map(([k, x]) => chip(k) + " " + n(x * cnt)).join(" ")] : ["—"], sure(r.sure * cnt), sure(d * cnt), n(r.guc * cnt)] });
  }
  const stok = g("c-s") * 3600; const sonra = Math.max(0, etkin - stok);
  document.getElementById("c-out").innerHTML = Object.entries(top).map(([k, x]) => `<div class="fact"><span>${chip(k)} ${esc(kad(k))}</span><strong>${n(x)}</strong></div>`).join("") +
    `<div class="fact"><span>Ham süre</span><strong>${sure(ham)}</strong></div>
     <div class="fact"><span>Etkin süre (toplam hız +%${nf.format(hiz)})</span><strong>${sure(etkin)}</strong></div>
     <div class="fact"><span>Hızlandırmadan sonra</span><strong>${sure(sonra)}</strong></div>
     <div class="fact"><span>Kazanılan güç</span><strong>${n(guc)}</strong></div>`;
  document.getElementById("c-rows").innerHTML = rows.length ? table(["Sv", "Maliyet", "Ham süre", "Etkin süre", "Güç"], rows, [true, false, true, true, true]) : "";
}

/* --- kahramanlar -------------------------------------------------------- */
function viewHeroes() {
  const H = DB.kahramanlar;
  if (!H) { app.innerHTML = `<p class="empty">Kahraman verisi henüz yok.</p>`; return; }
  const sel = H.liste.find((h) => h.id === state.kahraman);
  if (!sel) {
    const byR = H.nadirlikler.slice().reverse();
    app.innerHTML = `<section class="detail"><div><h2>Kahramanlar</h2><p class="lede">${H.liste.length} kahraman. Bir karta dokun: yetenekler, yıldız eşikleri ve istatistikler.</p></div>` +
      byR.map((r) => { const l = H.liste.filter((h) => h.nadirlik === r.id); return l.length ? `<div><h4>${esc(r.ad)} · ${l.length}</h4><div class="cards">` +
        l.map((h) => `<button class="card" data-h="${h.id}" style="--rc:var(--r-${r.id})"><b>${esc(h.ad)}</b><small>${esc(h.sinifAd)} · ${esc(h.fraksiyonAd)}</small><small>Güç (Sv 50, 5★): ${n(h.guc50)}</small></button>`).join("") + "</div></div>" : ""; }).join("") + "</section>";
    document.querySelectorAll(".card").forEach((c) => c.addEventListener("click", () => { state.kahraman = c.dataset.h; viewHeroes(); }));
    return;
  }
  const h = sel;
  const stat = table(["Sv", "1★", "2★", "3★", "4★", "5★"], h.statlar.map((r) => ({ cells: [r[0], ...r.slice(1).map((s) => s ? `${n(s[0])} / ${n(s[1])} / ${n(s[2])}` : "—")] })), [true, true, true, true, true, true]);
  const skills = h.yetenekler.length ? table(["Yetenek", "Tür", "Açılış", "Etki (seviye 1–5)"], h.yetenekler.map((y) => ({ cells: [esc(y.ad), esc(y.tur), y.yildiz + "★", esc(y.aciklama)] })), [false, false, true, false]) : "";
  app.innerHTML = `<section class="detail">
    <div class="row"><button class="item" id="back" style="width:auto">← Tüm kahramanlar</button></div>
    <div><h2>${esc(h.ad)}</h2>${h.unvan ? `<p class="lede">${esc(h.unvan)}</p>` : ""}</div>
    <div class="meta"><span class="pill" style="border-color:var(--r-${h.nadirlik});color:var(--r-${h.nadirlik})">${esc(h.nadirlikAd)}</span><span class="pill">${esc(h.sinifAd)}</span><span class="pill">${esc(h.fraksiyonAd)}</span><span class="pill">${h.nesil}. nesil</span><span class="pill ${h.kodda ? "st-kodda" : ""}">${h.kodda ? "✅ oyunda var" : "⬜ tasarım"}</span></div>
    ${h.biyografi ? `<p>${esc(h.biyografi)}</p>` : ""}
    ${h.murettebat ? `<div><h4>Mürettebat becerisi · ${esc(h.murettebat.ad)}</h4><div class="facts">${h.murettebat.degerler.map((x, i) => `<div class="fact"><span>${i + 1}★ · Sv ${(i + 1) * 10}</span><strong>${bicim(x, "yuzde")}</strong></div>`).join("")}</div></div>` : ""}
    ${skills ? `<div><h4>Yetenekler</h4>${skills}</div>` : ""}
    <div><h4>İstatistikler (ATK / DEF / HP)</h4>${stat}<p class="note">Seviye sınırı yıldız × 10. Güç = (ATK + DEF + HP / 10) × 10.</p></div>
    ${h.agaclar.length ? `<div><h4>Yetenek ağaçları</h4><div class="meta">${h.agaclar.map((a) => `<span class="pill">${esc(a)}</span>`).join("")}</div></div>` : ""}
  </section>`;
  document.getElementById("back").onclick = () => { state.kahraman = null; viewHeroes(); };
}

/* --- araştırma ---------------------------------------------------------- */
function viewResearch() {
  const A = DB.arastirma;
  if (!A) { app.innerHTML = `<p class="empty">Araştırma verisi henüz yok.</p>`; return; }
  state.dal = state.dal || A.dallar[0].id;
  const list = A.dallar.map((d) => `<button class="item" data-d="${d.id}" aria-selected="${d.id === state.dal}">${esc(d.ad)}<span class="tag">${A.teknolojiler.filter((t) => t.dal === d.id).length}</span></button>`).join("");
  app.innerHTML = `<div class="cols"><aside class="list"><div class="group"><h3>Dallar</h3>${list}</div></aside><section class="detail" id="rd"></section></div>`;
  document.querySelectorAll(".item[data-d]").forEach((el) => el.addEventListener("click", () => { state.dal = el.dataset.d; viewResearch(); }));
  const d = A.dallar.find((x) => x.id === state.dal);
  const ts = A.teknolojiler.filter((t) => t.dal === d.id);
  document.getElementById("rd").innerHTML = `<div><h2>${esc(d.ad)}</h2><p class="lede">${esc(d.aciklama || "")}</p></div>
    <div class="meta"><span class="pill">${esc(d.kuyruk || "")}</span>${d.acilis ? `<span class="pill">Açılış: ${esc(d.acilis)}</span>` : ""}<span class="pill">${ts.length} teknoloji · ${ts.reduce((s, t) => s + t.maks, 0)} seviye</span></div>` +
    ts.map((t) => {
      const cols = resCols(t.satirlar, "bedel");
      return `<div><h4>${esc(t.ad)} · ${t.maks} seviye ${t.kodda ? "· ✅" : ""}</h4><p class="note">${esc(t.aciklama || "")}${t.gerekli ? " Gerekli: " + esc(t.gerekli) + "." : ""}</p>` +
        table(["Sv", "Lab"].concat(cols.map(kad)).concat(["Süre", "Etki (toplam)"]), t.satirlar.map((r) => ({ cells: [r.seviye, r.lab, ...cols.map((c) => n(r.bedel[c])), sure(r.sure), esc(r.etki)] })),
          [true, true, ...cols.map(() => true), true, true]) + "</div>";
    }).join("");
}

/* --- tempo -------------------------------------------------------------- */
function viewTempo() {
  const P = DB.sim; const W = 760, H = 360, L = 44, R = 16, T = 16, B = 34;
  const maxD = Math.ceil(Math.max(...P.map((p) => p.gunler[p.gunler.length - 1])) / 50) * 50;
  const x = (d) => L + (d / maxD) * (W - L - R), y = (lv) => T + (1 - (lv - 1) / 49) * (H - T - B);
  const grid = [10, 20, 30, 40, 50].map((lv) => `<line x1="${L}" x2="${W - R}" y1="${y(lv)}" y2="${y(lv)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(lv) + 4}" text-anchor="end">R${lv}</text>`).join("") +
    Array.from({ length: maxD / 50 + 1 }, (_, i) => i * 50).map((d) => `<text x="${x(d)}" y="${H - 12}" text-anchor="middle">${d}</text>`).join("");
  const lines = P.map((p, i) => { const pts = [[0, 1]].concat(p.gunler.map((g, j) => [g, j + 2])); const c = `var(--s${i + 1})`;
    return `<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${pts.map(([d, lv]) => x(d).toFixed(1) + "," + y(lv).toFixed(1)).join(" ")}"/><circle cx="${x(pts[pts.length - 1][0])}" cy="${y(50)}" r="4" fill="${c}"/>`; }).join("");
  const ms = [10, 20, 30, 35, 40, 45, 50];
  app.innerHTML = `<section class="detail"><div><h2>Çekirdek Reaktör'e yolculuk</h2><p class="lede">Üç oyuncu profilinin Reaktör 50'ye ulaştığı gün. Simülasyon kritik yolu (reaktör + önkoşullar) inşaatçı inşaatçı oynatır; varsayımlar kılavuzun Tempo ve Denge bölümündedir.</p></div>
    <div class="legend">${P.map((p, i) => `<span><span class="dot" style="background:var(--s${i + 1})"></span> ${esc(p.ad)} · ${gun(p.gunler[p.gunler.length - 1])}</span>`).join("")}</div>
    <div class="chart tbl" style="padding:8px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Reaktör seviyesi ve gün">${grid}${lines}<text x="${(W + L) / 2}" y="${H - 1}" text-anchor="middle">gün</text></svg></div>
    ${table(["Reaktör"].concat(P.map((p) => p.ad)), ms.map((lv) => ({ cells: ["R" + lv, ...P.map((p) => gun(p.gunler[lv - 2]))] })), [false, true, true, true])}</section>`;
}

/* --- diğer tablolar ----------------------------------------------------- */
function viewTables() {
  const T = DB.tablolar;
  if (!T.length) { app.innerHTML = `<p class="empty">Henüz ek tablo yok.</p>`; return; }
  const list = T.map((t, i) => `<button class="item" data-t="${i}" aria-selected="${i === state.tablo}">${esc(t.baslik)}<span class="tag">${t.satirlar.length}</span></button>`).join("");
  app.innerHTML = `<div class="cols"><aside class="list"><input class="search" id="tq" placeholder="Tablo ara" aria-label="Tablo ara"><div class="group" id="tlist">${list}</div></aside><section class="detail" id="td"></section></div>`;
  const bind = () => document.querySelectorAll("#tlist .item").forEach((el) => el.addEventListener("click", () => { state.tablo = Number(el.dataset.t); viewTables(); }));
  bind();
  document.getElementById("tq").addEventListener("input", (e) => { const q = e.target.value.toLocaleLowerCase("tr");
    document.querySelectorAll("#tlist .item").forEach((el) => { el.hidden = !el.textContent.toLocaleLowerCase("tr").includes(q); }); });
  const t = T[state.tablo] || T[0];
  const num = t.sutunlar.map((c) => t.satirlar.every((r) => r[c[0]] === undefined || r[c[0]] === null || typeof r[c[0]] === "number"));
  document.getElementById("td").innerHTML = `<div><h2>${esc(t.baslik)}</h2><p class="note">Kaynak: <code>veri/${esc(t.kaynak)}</code></p></div>` +
    table(t.sutunlar.map((c) => c[1]), t.satirlar.map((r) => ({ cells: t.sutunlar.map((c) => esc(bicim(r[c[0]], c[2]))) })), num);
}
