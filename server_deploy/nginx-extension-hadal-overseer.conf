# HADAL Overseer + APK download — isolated nginx extension on kale (aaPanel-compatible)
# Install: /www/server/panel/vhost/nginx/extension/hadal.cicibyte.com/hadal-overseer.conf
# via server_deploy/install-overseer-proxy.sh, which fills in the proxy key from the CT's .env.
# This template is in git; the rendered file (with the key) exists only on kale, mode 600.
#
# ^~ keeps the vhost's regex locations (e.g. the *.js / *.css cache rule) from taking over.

# Overseer panel and API live in the gateway (docs/22). The gateway answers 404 to any
# /admin request without this key, so the panel is reachable only through this door.
location ^~ /admin {
    proxy_pass https://hadal-api.cicibyte.com;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name hadal-api.cicibyte.com;
    proxy_set_header Host hadal-api.cicibyte.com;
    proxy_set_header X-Overseer-Key "__HADAL_ADMIN_PROXY_KEY__";
    # hadal.cicibyte.com is behind Cloudflare, which sets CF-Connecting-IP itself.
    proxy_set_header X-Overseer-Client-IP $http_cf_connecting_ip;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 30s;
    client_max_body_size 2m;
    access_log /www/wwwlogs/hadal.cicibyte.com.overseer.log;
}

# Android build for testers, served from kale (fast uplink).
location ^~ /download/ {
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}
