# HADAL backend stack — ports per HADAL_SERVER_INFRASTRUCTURE.md §4, all bound to 127.0.0.1.
# Run from server/:  docker compose -f docker-compose.hadal.yml --env-file .env up -d --build
name: hadal

networks:
  hadal_net:
    name: hadal_isolated_net

services:
  hadal-redis:
    image: redis:7-alpine
    container_name: hadal-redis
    restart: unless-stopped
    networks: [hadal_net]
    ports: ["127.0.0.1:19004:6379"]
    volumes: [hadal_redis_data:/data]

  hadal-postgres:
    image: postgres:16-alpine
    container_name: hadal-postgres
    restart: unless-stopped
    networks: [hadal_net]
    ports: ["127.0.0.1:19005:5432"]
    environment:
      POSTGRES_DB: hadal
      POSTGRES_USER: hadal_app
      POSTGRES_PASSWORD: ${HADAL_DB_PASSWORD:?set HADAL_DB_PASSWORD in .env}
    volumes: [hadal_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadal_app -d hadal"]
      interval: 5s
      timeout: 3s
      retries: 20

  hadal-gateway:
    build:
      context: ..
      dockerfile: server/Hadal.Gateway/Dockerfile
    container_name: hadal-gateway
    restart: unless-stopped
    networks: [hadal_net]
    ports: ["127.0.0.1:19001:8080"]
    environment:
      ConnectionStrings__Hadal: "Host=hadal-postgres;Port=5432;Database=hadal;Username=hadal_app;Password=${HADAL_DB_PASSWORD}"
      Auth__JwtSecret: "${HADAL_JWT_SECRET:?set HADAL_JWT_SECRET in .env}"
      # Sign in with Google: comma-separated OAuth client ids accepted as ID-token audience (the WEB
      # client id the Android app passes as serverClientId). Empty = Google linking/sign-in disabled.
      Auth__GoogleClientIds: "${HADAL_GOOGLE_CLIENT_IDS:-}"
      Version__MinClientVersion: "${HADAL_MIN_CLIENT_VERSION:-0.0.0}"
      Version__LatestClientVersion: "${HADAL_LATEST_CLIENT_VERSION:-0.0.0}"
      Version__Maintenance: "${HADAL_MAINTENANCE:-false}"
      Version__Message: "${HADAL_MAINTENANCE_MESSAGE:-}"
      # Highest catalog design version a release publishes by itself (0 = any); lets code ship before its balance.
      Game__PublishCatalogUpTo: "${HADAL_PUBLISH_CATALOG_UP_TO:-0}"
      # Overseer (docs/22): the proxy key is shared only with the kale nginx that serves
      # hadal.cicibyte.com/admin; the JWT secret signs admin sessions (separate from players').
      Admin__ProxyKey: "${HADAL_ADMIN_PROXY_KEY:?set HADAL_ADMIN_PROXY_KEY in .env}"
      Admin__JwtSecret: "${HADAL_ADMIN_JWT_SECRET:?set HADAL_ADMIN_JWT_SECRET in .env}"
      # Test-only (unity.sh latency). Must stay 0 outside latency runs.
      Gateway__SimulatedLatencyMs: "${HADAL_SIM_LATENCY_MS:-0}"
      # Phone push (docs/36): the Firebase service-account key stays on the CT (path in .env) and is mounted
      # read-only; push is on only when the key and the project id are both set.
      HADAL_FCM_SERVICE_ACCOUNT_JSON_PATH: "${HADAL_FCM_SERVICE_ACCOUNT_JSON_PATH:+/run/secrets/hadal-fcm.json}"
      HADAL_FCM_PROJECT_ID: "${HADAL_FCM_PROJECT_ID:-}"
    volumes:
      - "${HADAL_FCM_SERVICE_ACCOUNT_JSON_PATH:-/dev/null}:/run/secrets/hadal-fcm.json:ro"
    depends_on:
      hadal-postgres:
        condition: service_healthy
      hadal-redis:
        condition: service_started

volumes:
  hadal_redis_data:
  hadal_pg_data:
